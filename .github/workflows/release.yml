name: Publicar Release (Windows + Android)

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build-windows:
    runs-on: windows-2025
    timeout-minutes: 25
    steps:
      - name: Optimizar entorno Windows (Defender + Git CRLF)
        shell: pwsh
        run: |
          Add-MpPreference -ExclusionPath "${{ github.workspace }}"
          Add-MpPreference -ExclusionPath "$env:USERPROFILE\.cargo"
          Add-MpPreference -ExclusionPath "$env:USERPROFILE\.rustup"
          Add-MpPreference -ExclusionProcess "rustc.exe", "cargo.exe", "link.exe", "lld-link.exe", "makensis.exe", "candle.exe", "light.exe"
          git config --global core.autocrlf false
          if (Get-Command lld-link -ErrorAction SilentlyContinue) {
            "RUSTFLAGS=-C linker=lld-link" | Out-File -FilePath $env:GITHUB_ENV -Append -Encoding utf8
          }

      - name: Descargar repositorio
        uses: actions/checkout@v4
        with:
          fetch-depth: 1

      - name: Verificar coincidencia de versión con tag
        if: startsWith(github.ref, 'refs/tags/v')
        shell: pwsh
        run: |
          $tagVer = "${{ github.ref_name }}".TrimStart('v')
          $pkgVer = (Get-Content package.json -Raw | ConvertFrom-Json).version
          $tauriVer = (Get-Content src-tauri/tauri.conf.json -Raw | ConvertFrom-Json).version
          $cargoMatch = [regex]::Match((Get-Content src-tauri/Cargo.toml -Raw), '(?m)^version\s*=\s*"([^"]+)"')
          $cargoVer = if ($cargoMatch.Success) { $cargoMatch.Groups[1].Value } else { "" }
          $stateMatch = [regex]::Match((Get-Content ui/js/state.js -Raw), 'APP_VERSION\s*=\s*"([^"]+)"')
          $stateVer = if ($stateMatch.Success) { $stateMatch.Groups[1].Value } else { "" }
          $checks = @{
            "package.json" = $pkgVer
            "src-tauri/tauri.conf.json" = $tauriVer
            "src-tauri/Cargo.toml" = $cargoVer
            "ui/js/state.js" = $stateVer
          }
          foreach ($entry in $checks.GetEnumerator()) {
            if ($entry.Value -ne $tagVer) {
              Write-Error "Desfase de versión en $($entry.Key): esperado '$tagVer', encontrado '$($entry.Value)'."
              exit 1
            }
          }
          Write-Host "Versión verificada ($tagVer) en todos los archivos."

      - name: Configurar Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: 'npm'

      - name: Configurar Rust estable
        uses: dtolnay/rust-toolchain@stable

      - name: Caché de Rust
        uses: swatinem/rust-cache@v2
        with:
          workspaces: src-tauri
          shared-key: "windows-release"
          cache-on-failure: true
          cache-all-crates: false
          save-if: ${{ github.ref == 'refs/heads/main' }}

      - name: Instalar dependencias npm
        run: npm ci

      - name: Compilar y publicar instalador Windows firmado (latest.json + .exe/.msi)
        uses: tauri-apps/tauri-action@v0
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          TAURI_SIGNING_PRIVATE_KEY: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY }}
          TAURI_SIGNING_PRIVATE_KEY_PASSWORD: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY_PASSWORD }}
        with:
          tagName: ${{ github.ref_name }}
          releaseName: 'Vitamina D Simulator ${{ github.ref_name }}'
          releaseBody: 'Actualización automática para Windows (x64) y Android (APK universal firmado).'
          releaseDraft: false
          prerelease: false

  build-android:
    runs-on: ubuntu-24.04
    timeout-minutes: 25
    env:
      GRADLE_OPTS: "-Dorg.gradle.jvmargs=-Xmx4g -Dorg.gradle.parallel=true -Dorg.gradle.caching=true"
    steps:
      - name: Descargar repositorio
        uses: actions/checkout@v4
        with:
          fetch-depth: 1

      - name: Configurar Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: 'npm'

      - name: Configurar Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Configurar caché de Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          cache-read-only: ${{ github.ref != 'refs/heads/main' }}

      - name: Configurar Android SDK, NDK y Build-Tools
        run: |
          SDKMGR="$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager"
          PKGS=()
          if ! ls -d "$ANDROID_HOME/ndk/"* >/dev/null 2>&1; then
            PKGS+=("ndk;27.2.12479018")
          fi
          if ! ls -d "$ANDROID_HOME/build-tools/3"[5-9].* >/dev/null 2>&1; then
            PKGS+=("build-tools;35.0.0")
          fi
          if ! ls -d "$ANDROID_HOME/platforms/android-3"[5-9] >/dev/null 2>&1; then
            PKGS+=("platforms;android-35")
          fi
          if [ ${#PKGS[@]} -gt 0 ]; then
            yes | "$SDKMGR" --licenses > /dev/null 2>&1 || true
            "$SDKMGR" --install "${PKGS[@]}"
          fi
          NDK_DIR=$(ls -d "$ANDROID_HOME/ndk/"* | sort -V | tail -n 1)
          echo "NDK_HOME=$NDK_DIR" >> "$GITHUB_ENV"
          echo "ANDROID_NDK_HOME=$NDK_DIR" >> "$GITHUB_ENV"

      - name: Configurar Rust + targets Android (ARM64)
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: aarch64-linux-android

      - name: Caché de Rust
        uses: swatinem/rust-cache@v2
        with:
          workspaces: src-tauri
          shared-key: "android-arm64-release"
          cache-on-failure: true
          cache-all-crates: false
          save-if: ${{ github.ref == 'refs/heads/main' }}

      - name: Instalar dependencias npm
        run: npm ci

      - name: Inicializar y compilar APK Release
        run: |
          npx tauri android init --ci --skip-targets-install
          npx tauri android build --apk --target aarch64

      - name: Alinear y firmar APK con Keystore fijo
        env:
          ANDROID_KEYSTORE_BASE64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
          ANDROID_KEYSTORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
          ANDROID_KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
          ANDROID_KEY_PASSWORD: ${{ secrets.ANDROID_KEY_PASSWORD }}
        run: |
          echo "$ANDROID_KEYSTORE_BASE64" | base64 --decode > vitd-release.keystore
          BUILD_TOOLS=$(ls -d "$ANDROID_HOME/build-tools/"* | sort -V | tail -n 1)
          UNSIGNED_APK=$(find src-tauri/gen/android/app/build/outputs/apk -type f -name "*-release-unsigned.apk" | head -n 1)
          [ -n "$UNSIGNED_APK" ]
          SIGNED_APK="Vitamina-D-Simulator-${{ github.ref_name }}-android.apk"
          "$BUILD_TOOLS/zipalign" -v -p 4 "$UNSIGNED_APK" app-aligned.apk
          "$BUILD_TOOLS/apksigner" sign \
            --ks vitd-release.keystore \
            --ks-key-alias "$ANDROID_KEY_ALIAS" \
            --ks-pass "pass:$ANDROID_KEYSTORE_PASSWORD" \
            --key-pass "pass:$ANDROID_KEY_PASSWORD" \
            --out "$SIGNED_APK" \
            app-aligned.apk
          "$BUILD_TOOLS/apksigner" verify --verbose "$SIGNED_APK"
          rm -f vitd-release.keystore app-aligned.apk

      - name: Subir artefacto APK firmado
        uses: actions/upload-artifact@v4
        with:
          name: android-signed-apk
          path: Vitamina-D-Simulator-${{ github.ref_name }}-android.apk
          compression-level: 0
          retention-days: 1

  publish-android:
    needs: [build-windows, build-android]
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    steps:
      - name: Descargar APK firmado
        uses: actions/download-artifact@v4
        with:
          name: android-signed-apk

      - name: Subir APK firmado al Release de GitHub
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GH_REPO: ${{ github.repository }}
        run: |
          gh release upload "${{ github.ref_name }}" "Vitamina-D-Simulator-${{ github.ref_name }}-android.apk" --repo "${{ github.repository }}" --clobber
